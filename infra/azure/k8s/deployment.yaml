apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: torqvoice-uploads
  namespace: torqvoice
  labels:
    app: torqvoice
    part-of: torqvoice
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: managed-csi
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: torqvoice
  namespace: torqvoice
  labels:
    app: torqvoice
    part-of: torqvoice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: torqvoice
  template:
    metadata:
      labels:
        app: torqvoice
        part-of: torqvoice
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: torqvoice
          image: ghcr.io/torqvoice/torqvoice:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - secretRef:
                name: torqvoice
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: uploads
              mountPath: /app/data/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: torqvoice-uploads
