# Reviewable equivalent of kubernetes.tf + charts/app-secrets.
# Terraform applies the Helm/Kubernetes resources; this file is for review.
#
# Image: first-apply pin only (temporary public upstream digest so apply can
# create pods before ghcr.io/cookieofcode/torqvoice exists). We never push to
# ghcr.io/torqvoice/torqvoice. After bring-up, deploy-dev0.yml rolls
# Deployment/torqvoice to ghcr.io/cookieofcode/torqvoice@sha256:… .
# Terraform ignore_changes the image.
# Secret *data* is not in git or Terraform: External Secrets Operator copies
# postgres-admin-password and better-auth-secret from Key Vault into Secret
# `torqvoice`. If cookieofcode GHCR stays private: image_pull_secret_name
# after ESO syncs a dockerconfigjson (see image-pull-secret.yaml.example).
apiVersion: v1
kind: ConfigMap
metadata:
  name: torqvoice
  namespace: torqvoice
  labels:
    app: torqvoice
    part-of: torqvoice
data:
  NEXT_PUBLIC_APP_URL: "https://REPLACE_WITH_HOSTNAME_OR_HTTP_PIP"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: torqvoice-uploads
  namespace: torqvoice
  labels:
    app: torqvoice
    part-of: torqvoice
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: managed-csi
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: torqvoice
  namespace: torqvoice
  labels:
    app: torqvoice
    part-of: torqvoice
spec:
  replicas: 1
  # RWO uploads PVC: no surge pod (see kubernetes.tf).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: torqvoice
  template:
    metadata:
      labels:
        app: torqvoice
        part-of: torqvoice
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: torqvoice
          # Temporary first-apply pin only. Live CD image is
          # ghcr.io/cookieofcode/torqvoice@sha256:… (never push to upstream).
          image: ghcr.io/torqvoice/torqvoice@sha256:6efeb6b22b16e2666ccfc39a85ab102e1dd6ae0492d4896dd2cdc8f72557abad
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: torqvoice
            - secretRef:
                name: torqvoice
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: uploads
              mountPath: /app/data/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: torqvoice-uploads
