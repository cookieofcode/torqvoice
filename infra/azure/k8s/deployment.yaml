# Reviewable equivalent of kubernetes.tf + charts/app-secrets.
# Terraform applies the Helm/Kubernetes resources; this file is for review.
# No Azure RG/PIP names here. Do not kubectl-apply this directory as a
# later-env overlay (see service.yaml.example for the sole-dev0 PIP sample).
#
# Image is pinned by digest (bump in terraform.tfvars / variables.tf default).
# Secret *data* is not in git or Terraform: External Secrets Operator copies
# postgres-admin-password and better-auth-secret from Key Vault into Secret
# `torqvoice`. Optional private-registry pull secret: set image_pull_secret_name
# after ESO syncs a dockerconfigjson (see image-pull-secret.yaml.example).
apiVersion: v1
kind: ConfigMap
metadata:
  name: torqvoice
  namespace: torqvoice
  labels:
    app: torqvoice
    part-of: torqvoice
data:
  NEXT_PUBLIC_APP_URL: "https://REPLACE_WITH_HOSTNAME_OR_HTTP_PIP"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: torqvoice-uploads
  namespace: torqvoice
  labels:
    app: torqvoice
    part-of: torqvoice
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: managed-csi
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: torqvoice
  namespace: torqvoice
  labels:
    app: torqvoice
    part-of: torqvoice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: torqvoice
  template:
    metadata:
      labels:
        app: torqvoice
        part-of: torqvoice
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: torqvoice
          image: ghcr.io/torqvoice/torqvoice@sha256:6efeb6b22b16e2666ccfc39a85ab102e1dd6ae0492d4896dd2cdc8f72557abad
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: torqvoice
            - secretRef:
                name: torqvoice
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: uploads
              mountPath: /app/data/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: torqvoice-uploads
