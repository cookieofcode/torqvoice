# TODO: HTTPS — this Service is HTTP LoadBalancer for first bring-up only.
# Put TLS in front (ingress or Application Gateway) before using this as a
# long-term public URL. App Gateway WAF is out of scope for this lean stack.
apiVersion: v1
kind: Service
metadata:
  name: torqvoice
  namespace: torqvoice
  labels:
    app: torqvoice
    part-of: torqvoice
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-resource-group: rg-torqvoice-prod
    service.beta.kubernetes.io/azure-pip-name: pip-torqvoice-prod
spec:
  type: LoadBalancer
  selector:
    app: torqvoice
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
