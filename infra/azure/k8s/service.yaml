# Bringup (environment != prod, e.g. dev0): HTTP LoadBalancer on the static PIP.
# Prod: this Service is ClusterIP; TLS is on Ingress (see ingress.yaml).
# Applied names come from Terraform locals (rg-torqvoice-<environment>, pip-torqvoice-<environment>).
apiVersion: v1
kind: Service
metadata:
  name: torqvoice
  namespace: torqvoice
  labels:
    app: torqvoice
    part-of: torqvoice
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-resource-group: rg-torqvoice-dev0
    service.beta.kubernetes.io/azure-pip-name: pip-torqvoice-dev0
spec:
  type: LoadBalancer
  selector:
    app: torqvoice
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
