# EXAMPLE ONLY for environment=dev0 (first sole-dev0 apply).
# Do not kubectl-apply this manifest for any other environment — it is a
# review sample. Live Service annotations come from kubernetes.tf
# (rg-torqvoice-<environment> / pip-torqvoice-<environment>).
#
# Hard-coded rg-torqvoice-dev0 / pip-torqvoice-dev0 below match that
# example only. A later env is a hand-apply footgun if you copy these
# strings. Prod: Terraform sets type=ClusterIP; TLS is on Ingress.
apiVersion: v1
kind: Service
metadata:
  name: torqvoice
  namespace: torqvoice
  labels:
    app: torqvoice
    part-of: torqvoice
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-resource-group: rg-torqvoice-dev0
    service.beta.kubernetes.io/azure-pip-name: pip-torqvoice-dev0
spec:
  type: LoadBalancer
  selector:
    app: torqvoice
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
