# Applied by Terraform when enable_tls=true (kubernetes_ingress_v1).
# Point the hostname A record at the single Standard public IP, then
# cert-manager completes HTTP-01.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: torqvoice
  namespace: torqvoice
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - workshop.example.com
      secretName: torqvoice-tls
  rules:
    - host: workshop.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: torqvoice
                port:
                  number: 80
