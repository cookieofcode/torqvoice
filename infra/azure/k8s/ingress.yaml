# Review sample. Applied by Terraform when enable_tls=true (ingress.tf).
# workshop.example.com is a placeholder hostname, not an environment name.
# letsencrypt-prod is the Let's Encrypt ACME issuer name (not var.environment).
# Do not hand-apply this as a later-env overlay.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: torqvoice
  namespace: torqvoice
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - workshop.example.com
      secretName: torqvoice-tls
  rules:
    - host: workshop.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: torqvoice
                port:
                  number: 80
